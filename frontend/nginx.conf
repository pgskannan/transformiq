server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: React Router owns client-side routes (e.g. /dashboard,
  # /projects/:id/data-profile) that have no matching static file - without this, nginx's
  # default config 404s on any direct navigation or page refresh to one of those routes
  # (only in-app <Link> clicks worked, since those never leave the already-loaded index.html).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
