# Cloud Build → Artifact Registry → Cloud Run (TQ-002). NOT wired to a live GCP project —
# substitutions below are placeholders. Run this via a Cloud Build trigger once the user
# supplies _GCP_PROJECT_ID / _REGION / _AR_REPO for a real environment (see ADR 0002).
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_AR_REPO}/backend:$SHORT_SHA"
      - "./backend"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_AR_REPO}/backend:$SHORT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "transformiq-backend-${_ENVIRONMENT}"
      - "--image=${_REGION}-docker.pkg.dev/${_GCP_PROJECT_ID}/${_AR_REPO}/backend:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--no-allow-unauthenticated"

substitutions:
  _GCP_PROJECT_ID: REPLACE_ME
  _REGION: us-central1
  _AR_REPO: transformiq
  _ENVIRONMENT: dev

options:
  logging: CLOUD_LOGGING_ONLY
